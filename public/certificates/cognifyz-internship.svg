<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#F5D77A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181611" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="560" fill="url(#centerGlow)"/>
  <!-- Ornate Borders -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="url(#gold)" stroke-width="2" rx="8"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="6,4" rx="6" opacity="0.6"/>
  <!-- Corner Ornaments -->
  <path d="M 24 60 L 60 24 M 776 60 L 740 24 M 24 500 L 60 536 M 776 500 L 740 536" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Header / Issuer -->
  <text x="400" y="95" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="#F5D77A" text-anchor="middle" letter-spacing="4">COGNIFYZ TECHNOLOGIES</text>
  <text x="400" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#A3A3A3" text-anchor="middle" letter-spacing="3">WHERE DATA MEETS INTELLIGENCE</text>
  
  <line x1="280" y1="145" x2="520" y2="145" stroke="url(#gold)" stroke-width="1"/>
  
  <text x="400" y="190" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="url(#gold)" text-anchor="middle" font-style="italic">Certificate of Internship Completion</text>
  
  <text x="400" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#CCCCCC" text-anchor="middle">This is proudly presented to</text>
  <text x="400" y="285" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#FFF1B8" text-anchor="middle" letter-spacing="2">KAMESH J</text>
  
  <text x="400" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" fill="#BBBBBB" text-anchor="middle" width="600">
    for successfully completing the internship in <tspan fill="#F5D77A" font-weight="600">Frontend Development</tspan> from Aug 2025 to Sep 2025.
  </text>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888888" text-anchor="middle">
    Demonstrated outstanding dedication, coordination, communication, and high attention to detail.
  </text>

  <!-- Bottom Details -->
  <g transform="translate(80, 430)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8C7326">INTERN ID</text>
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F5D77A">CTI/A1/C197822</text>
    <text x="0" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#777777">Date of Issue: 09/09/2025</text>
  </g>

  <!-- Gold Seal -->
  <g transform="translate(400, 445)">
    <circle cx="0" cy="0" r="38" fill="#1A1811" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F5D77A" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="0" y="8" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="700" fill="url(#gold)" text-anchor="middle">★</text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#CCCCCC" text-anchor="middle">EXCELLENCE</text>
  </g>

  <!-- Authorized Signatory -->
  <g transform="translate(620, 430)">
    <path d="M -60 15 Q -20 -10 20 10 T 60 5" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
    <line x1="-70" y1="22" x2="70" y2="22" stroke="#555555" stroke-width="1"/>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CCCCCC" text-anchor="middle">Authorized Signatory</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#777777" text-anchor="middle">Cognifyz Technologies</text>
  </g>
</svg>
